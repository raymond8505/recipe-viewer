name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn test:run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker build
        run: docker build --build-arg NEXT_PUBLIC_SUPABASE_URL=placeholder --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=placeholder .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          RESCRAPE_WEBHOOK_URL: ${{ secrets.RESCRAPE_WEBHOOK_URL }}
          EDIT_WEBHOOK_URL: ${{ secrets.EDIT_WEBHOOK_URL }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          REGEN_IMAGE_WEBHOOK_URL: ${{ secrets.REGEN_IMAGE_WEBHOOK_URL }}
          WHATS_FOR_DINNER_WEBHOOK_URL: ${{ secrets.WHATS_FOR_DINNER_WEBHOOK_URL }}
          HEADSUP_SEARCH_WEBHOOK_URL: ${{ secrets.HEADSUP_SEARCH_WEBHOOK_URL }}
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_KEY,AUTH_PASSWORD,RESCRAPE_WEBHOOK_URL,EDIT_WEBHOOK_URL,MCP_API_TOKEN,REGEN_IMAGE_WEBHOOK_URL,WHATS_FOR_DINNER_WEBHOOK_URL,HEADSUP_SEARCH_WEBHOOK_URL,GH_DEPLOY_KEY
          script: |
            set -e

            # Set up deploy key for private repo access
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "${GH_DEPLOY_KEY}" > ~/.ssh/github_recipe_viewer
            chmod 600 ~/.ssh/github_recipe_viewer
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_recipe_viewer"

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"

            if [ -d "${DEPLOY_PATH}/.git" ]; then
              # Existing git repo — fetch and force-reset to latest main
              cd "${DEPLOY_PATH}"
              git remote set-url origin git@github.com:raymond8505/recipe-viewer.git
              git fetch origin main
              git reset --hard origin/main
            elif [ -d "${DEPLOY_PATH}" ]; then
              # Directory exists but isn't a git repo (legacy tar-based deploy)
              cd "${DEPLOY_PATH}"
              git init
              git remote add origin git@github.com:raymond8505/recipe-viewer.git
              git fetch origin
              git checkout -f -B main origin/main
            else
              # Fresh clone
              git clone git@github.com:raymond8505/recipe-viewer.git "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
            fi

            # Write env file for docker compose build args and runtime
            {
              echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
              echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${SUPABASE_KEY}"
              echo "AUTH_PASSWORD=${AUTH_PASSWORD}"
              echo "RESCRAPE_WEBHOOK_URL=${RESCRAPE_WEBHOOK_URL}"
              echo "EDIT_WEBHOOK_URL=${EDIT_WEBHOOK_URL}"
              echo "MCP_API_TOKEN=${MCP_API_TOKEN}"
              echo "REGEN_IMAGE_WEBHOOK_URL=${REGEN_IMAGE_WEBHOOK_URL}"
              echo "WHATS_FOR_DINNER_WEBHOOK_URL=${WHATS_FOR_DINNER_WEBHOOK_URL}"
              echo "HEADSUP_SEARCH_WEBHOOK_URL=${HEADSUP_SEARCH_WEBHOOK_URL}"
            } > .env

            docker compose up -d --build --remove-orphans

            # Health check — wait up to 60s for the container to respond
            echo "Waiting for container..."
            for i in $(seq 1 12); do
              docker exec recipe-viewer curl --silent --fail http://localhost:3001/ > /dev/null && \
                echo "Health check passed!" && break || true
              if [ "$i" = "12" ]; then
                echo "Health check failed after 60s — recent logs:"
                docker logs --tail 50 recipe-viewer
                exit 1
              fi
              sleep 5
            done

            # Clean up dangling images after build
            docker image prune -f
